      session_timestamp: '2025-02-08 12:00:00+00'
      campaign_id: C
      channel: Google Paid Search
      source_medium: google / cpc
    - session_id: s8a
      customer_id: '8'
      session_timestamp: '2025-02-07 12:00:00+00'
      campaign_id: C
