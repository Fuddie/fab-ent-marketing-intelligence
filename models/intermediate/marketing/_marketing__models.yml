      customer_id: '2'
      order_timestamp: null
    - order_id: '3'
      customer_id: '3'
      order_timestamp: '2025-02-08 12:00:00+00'
    - order_id: '4'
      customer_id: '4'
      order_timestamp: '2025-02-08 12:00:00+00'
    - order_id: '5'
      customer_id: '5'
      order_timestamp: '2025-02-08 12:00:00+00'
    - order_id: '6'
      customer_id: '6'
      order_timestamp: '2025-02-08 12:00:00+00'
    - order_id: '7'
      customer_id: '7'
      order_timestamp: '2025-02-08 12:00:00+00'
    - order_id: '8'
      customer_id: '8'
      order_timestamp: '2025-02-08 12:00:00+00'
    - order_id: '9'
      customer_id: '9'
      order_timestamp: '2025-02-08 12:00:00+00'
  - input: ref('stg_marketing__web_sessions')
    rows:
    - session_id: s2
      customer_id: '2'
      session_timestamp: '2025-02-07 12:00:00+00'
      campaign_id: C
      channel: Google Paid Search
      source_medium: google / cpc
    - session_id: s3
      customer_id: '3'
      session_timestamp: null
