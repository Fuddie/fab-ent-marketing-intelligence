version: 2
models:
- name: int_marketing__order_attribution_candidates
  description: 'Audit grain: one order and same-customer session pair, or one NULL-session
    placeholder. No order amounts are copied here. Full available session history
    exposes excluded touches. Rank eligible touches by latest UTC instant then greatest
    lexical session ID.'
  columns:
  - name: order_id
    description: Source order key; no status exclusions.
  - name: customer_id
    description: Exact source customer identity; never inferred.
  - name: order_timestamp
    description: UTC-aware purchase attempt instant.
  - name: session_id
    description: Selected or evaluated stable session identifier.
  - name: campaign_id
    description: Selected or evaluated source campaign identifier.
  - name: source_medium
    description: Unmodified session traffic classification.
  - name: source
    description: Source component split from source_medium at the literal separator
      space/slash/space.
  - name: medium
    description: Medium component split from source_medium at the literal separator
      space/slash/space.
  - name: channel
    description: Source session channel.
  - name: interaction_timestamp
    description: UTC-aware session start instant.
  - name: attribution_window_start
    description: Inclusive UTC lower boundary, exactly 168 elapsed hours before purchase.
  - name: session_customer_id
    description: Session identity for exact-match auditing.
  - name: candidate_status
    description: First exclusion reason in model CASE order, or eligible; full same-customer
      history is retained, with a NULL-session placeholder when none exists.
  - name: is_eligible
    description: True only for an identified paid campaign session in the half-open
      interval with a known campaign.
  - name: eligible_rank
    description: Eligible-only rank by interaction timestamp descending then lexical
      session ID descending; NULL for excluded rows.
  - name: is_winner
    description: True exactly for eligible rank 1; false for every excluded row.
- name: int_marketing__orders_attributed
  description: Exactly one row per source order across all statuses. Last identified
    paid non-direct campaign session in [purchase minus 168 hours, purchase), recomputed
    on every build. No commercial KPI policy is applied.
  columns:
  - name: order_id
    description: Source order key; no status exclusions.
    data_tests:
    - not_null
    - unique
  - name: customer_id
    description: Exact source customer identity; never inferred.
  - name: order_timestamp
    description: UTC-aware purchase attempt instant.
  - name: session_id
    description: Selected or evaluated stable session identifier.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_marketing__web_sessions')
          field: session_id
  - name: campaign_id
    description: Selected or evaluated source campaign identifier.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_marketing__campaigns')
          field: campaign_id
  - name: source_medium
    description: Unmodified session traffic classification.
  - name: source
    description: Source component split from source_medium at the literal separator
      space/slash/space.
  - name: medium
    description: Medium component split from source_medium at the literal separator
      space/slash/space.
  - name: channel
    description: Source session channel.
  - name: interaction_timestamp
    description: UTC-aware session start instant.
  - name: status
    description: Unmodified order status; commercial eligibility remains unresolved.
  - name: gross_order_amount_gbp
    description: Unmodified DECIMAL(18,2) gross GBP amount, including cancelled attempts.
  - name: refund_amount_gbp
    description: Unmodified final snapshot refund/cancellation reversal GBP amount.
  - name: net_order_amount_gbp
    description: Unmodified source gross less reversal GBP amount; no revenue policy
      inferred.
  - name: attribution_status
    description: 'Exhaustive assignment state: attributed or unattributed, across
      all statuses.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - attributed
          - unattributed
  - name: unattributed_reason
    description: 'NULL for attributed. Otherwise priority: missing order identity,
      missing order time, no same-customer sessions, missing interaction time, unknown
      campaign, missing campaign in window, then no eligible interaction in window.
      A diagnostic, not proof of a unique cause; inspect candidates for all exclusions.'
