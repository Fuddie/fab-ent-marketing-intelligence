    data_tests:
    - not_null
  - name: raw_net_order_amount_gbp
    description: All-status source net amount; raw gross minus sales refunds minus
      cancellation reversals. Audit reconciliation.
    data_tests:
    - not_null
  - name: attributed_gross_merchandise_revenue_gbp
    description: Original merchandise value of completed, partially_refunded and refunded
      sales, excluding cancelled attempts. Not accounting revenue. Restricted to attributed
      orders across revenue-eligible statuses (cancellation reversals use cancelled
