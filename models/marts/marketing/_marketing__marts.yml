    data_tests:
    - not_null
  - name: first_observed_acquisitions
    description: Customers whose earliest eligible order across all available snapshot
      history falls in this period/scope; each customer counted once.
    data_tests:
    - not_null
  - name: attributed_first_observed_acquisitions
    description: First observed acquisitions with paid campaign assignment; denominator
