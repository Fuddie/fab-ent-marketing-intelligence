    description: Source deductions for cancelled attempts only; bookkeeping reversal,
      not evidence of a cash refund.
    data_tests:
    - not_null
  - name: net_revenue_gbp
    description: Non-cancelled sales net amount, including signed/zero values. Gross
      merchandise revenue minus sales refunds, without subtracting refunds twice.
    data_tests:
    - not_null
  - name: raw_net_order_amount_gbp
    description: All-status source net amount; raw gross minus sales refunds minus
      cancellation reversals. Audit reconciliation.
    data_tests:
    - not_null
  - name: attributed_gross_merchandise_revenue_gbp
    description: Original merchandise value of completed, partially_refunded and refunded
      sales, excluding cancelled attempts. Not accounting revenue. Restricted to attributed
      orders across revenue-eligible statuses (cancellation reversals use cancelled
      status).
    data_tests:
    - not_null
  - name: unattributed_gross_merchandise_revenue_gbp
    description: Original merchandise value of completed, partially_refunded and refunded
      sales, excluding cancelled attempts. Not accounting revenue. Restricted to unattributed
      orders across revenue-eligible statuses (cancellation reversals use cancelled
      status).
    data_tests:
    - not_null
  - name: attributed_sales_refunds_gbp
    description: Positive source deductions for non-cancelled sales, including partial
      and full refunds; final snapshot at original order time. Restricted to attributed
      orders across revenue-eligible statuses (cancellation reversals use cancelled
      status).
    data_tests:
    - not_null
  - name: unattributed_sales_refunds_gbp
    description: Positive source deductions for non-cancelled sales, including partial
      and full refunds; final snapshot at original order time. Restricted to unattributed
      orders across revenue-eligible statuses (cancellation reversals use cancelled
      status).
    data_tests:
    - not_null
  - name: attributed_cancellation_reversals_gbp
    description: Source deductions for cancelled attempts only; bookkeeping reversal,
      not evidence of a cash refund. Restricted to attributed orders across revenue-eligible
      statuses (cancellation reversals use cancelled status).
    data_tests:
    - not_null
  - name: unattributed_cancellation_reversals_gbp
    description: Source deductions for cancelled attempts only; bookkeeping reversal,
      not evidence of a cash refund. Restricted to unattributed orders across revenue-eligible
      statuses (cancellation reversals use cancelled status).
    data_tests:
    - not_null
  - name: attributed_net_revenue_gbp
    description: Non-cancelled sales net amount, including signed/zero values. Gross
      merchandise revenue minus sales refunds, without subtracting refunds twice.
      Restricted to attributed orders across revenue-eligible statuses (cancellation
      reversals use cancelled status).
    data_tests:
    - not_null
  - name: unattributed_net_revenue_gbp
    description: Non-cancelled sales net amount, including signed/zero values. Gross
      merchandise revenue minus sales refunds, without subtracting refunds twice.
      Restricted to unattributed orders across revenue-eligible statuses (cancellation
      reversals use cancelled status).
    data_tests:
    - not_null
  - name: allocated_budget_gbp
    description: Lifetime campaign budget allocated uniformly across inclusive active
      days; additive across days/campaigns. Monthly totals are allocations, not approved
      monthly budgets; floating precision may require tolerance.
    data_tests:
    - not_null
  - name: negative_input_count
    description: Internal diagnostic count of negative media rows, orders (including
      associated line anomalies), or campaign-budget days. Not a count of distinct
      errors; >0 drives a flag.
    data_tests:
    - not_null
  - name: ctr_pct
    description: 100 * total clicks / total impressions; NULL for zero/missing denominator.
      Recompute from components when rolling up.
  - name: cpc_gbp
    description: Recorded media spend / clicks in GBP; NULL for zero/missing denominator.
  - name: conversion_rate_pct
    description: 'Campaign/paid channel: 100 * attributed eligible orders / valid
      classified sessions. Overview: 100 * all eligible orders / all valid sessions.
      Direct/Organic/Unattributed channel rates are NULL. Period order-to-session
      rate, potentially above 100%.'
  - name: gross_roas
    description: Attributed gross merchandise revenue / media spend, a multiple. Overview
      excludes unattributed revenue from this numerator. NULL for zero spend or absent
      channel cost coverage.
  - name: net_roas
    description: Attributed net merchandise revenue / media spend, a multiple. NULL
      for zero spend or absent channel cost coverage; not profit or causal return.
  - name: media_only_cac_gbp
    description: Period media spend / period attributed first observed acquisitions.
      NULL for zero denominator or unavailable channel costs. Neither lifetime, fully
      loaded nor spend-cohort CAC.
  - name: attribution_rate_pct
    description: 100 * attributed eligible orders / all eligible orders at row scope;
      NULL with no eligible orders. Campaign/paid scopes are necessarily 100% when
      defined; overview measures overall coverage.
  - name: budget_utilisation_pct
    description: 'Percent: daily campaign cumulative spend / lifetime budget; summary
      full spend / lifetime budget; monthly spend / allocated active-day budget. NULL
      for zero denominator.'
  - name: budget_pacing_pct
    description: 'Percent: daily campaign cumulative spend / expected cumulative spend;
      completed-horizon summary utilisation; monthly spend / allocated monthly budget.
      NULL for zero denominator.'
  - name: flag_spend_without_eligible_attributed_orders
    description: Period recorded spend > 0 and attributed eligible orders = 0. Includes
      spend-only campaigns; not a causal waste claim.
    data_tests:
    - not_null
  - name: flag_budget_overspend
    description: Budget utilisation >100%; false when undefined. Daily compares cumulative
      spend with lifetime budget; monthly compares period allocation.
    data_tests:
    - not_null
  - name: flag_ahead_of_budget_pacing
    description: Budget pacing >100%; false when undefined. Straight-line monitoring
      convention.
    data_tests:
    - not_null
  - name: flag_approaching_budget
    description: Budget utilisation >=90% and <=100%; false when undefined. Adopted
      monitoring threshold.
    data_tests:
    - not_null
  - name: flag_unexpected_negative_inputs
    description: True if negative media, budget, order or order-line inputs were detected.
      Values are preserved, not clamped.
    data_tests:
    - not_null
  - name: flag_incomplete_attribution
    description: Unattributed placed orders >0 at row scope. False on campaign scopes
      cannot establish global completeness; inspect monthly overview.
    data_tests:
    - not_null
- name: mart_marketing__campaign_monthly
  description: One row per Europe/London reporting month and campaign, derived exclusively
    from the governed campaign daily mart. Revenue restates purchase months; eligible
    conversions and revenue retain separate contract scopes.
  data_tests:
  - marketing_unique_grain:
      arguments:
        columns:
        - reporting_month
        - campaign_id
  columns:
  - name: reporting_month
    description: First day of the Europe/London reporting month.
    data_tests:
    - not_null
  - name: campaign_id
    description: Same definition as governed campaign daily, summed for additive measures.
    data_tests:
    - not_null
  - name: campaign_name
    description: Same definition as governed campaign daily, summed for additive measures.
    data_tests:
    - not_null
  - name: marketing_channel
    description: Same definition as governed campaign daily, summed for additive measures.
    data_tests:
    - not_null
  - name: spend_gbp
    description: Same definition as governed campaign daily, summed for additive measures.
    data_tests:
    - not_null
  - name: eligible_conversions
    description: Same definition as governed campaign daily, summed for additive measures.
    data_tests:
    - not_null
  - name: attributed_gross_merchandise_revenue_gbp
    description: Same definition as governed campaign daily, summed for additive measures.
    data_tests:
    - not_null
  - name: attributed_net_revenue_gbp
    description: Same definition as governed campaign daily, summed for additive measures.
    data_tests:
    - not_null
  - name: net_roas
    description: Governed daily measure rolled up to campaign month; net ROAS divides
      monthly attributed net revenue by monthly spend.
