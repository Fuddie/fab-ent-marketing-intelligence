version: 2
models:
- name: int_marketing__governed_orders
  description: Internal governed order grain. Adds London date, explicit eligibility
    and revenue scope to each unchanged all-status attributed order. Line anomalies
    are aggregated before joining; no amounts are duplicated.
  data_tests:
  - marketing_unique_grain:
      arguments:
        columns:
        - order_id
  columns:
  - name: order_id
    description: Source order key; no status exclusions.
    data_tests:
    - not_null
    - unique
    - relationships:
        arguments:
          to: ref('stg_marketing__orders')
          field: order_id
  - name: order_timestamp
    description: UTC-aware purchase attempt instant.
    data_tests:
    - not_null
  - name: customer_id
    description: Exact identified source customer; one acquisition per customer across
      the whole snapshot.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_marketing__customers')
          field: customer_id
  - name: status
    description: Unmodified order status; commercial eligibility remains unresolved.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - completed
          - partially_refunded
          - refunded
          - cancelled
  - name: gross_order_amount_gbp
    description: Unmodified DECIMAL(18,2) gross GBP amount, including cancelled attempts.
    data_tests:
    - not_null
  - name: refund_amount_gbp
    description: Unmodified final snapshot refund/cancellation reversal GBP amount.
    data_tests:
    - not_null
  - name: net_order_amount_gbp
    description: Unmodified source gross less reversal GBP amount; no revenue policy
      inferred.
    data_tests:
    - not_null
  - name: session_id
    description: Selected or evaluated stable session identifier.
  - name: campaign_id
    description: Canonical single-channel campaign key; NULL only for campaignless
      sessions or unmatched outcomes in internal daily facts.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_marketing__campaigns')
          field: campaign_id
  - name: source_medium
    description: Unmodified session traffic classification.
  - name: source
    description: Source component split from source_medium at the literal separator
      space/slash/space.
  - name: medium
    description: Medium component split from source_medium at the literal separator
      space/slash/space.
  - name: channel
    description: Source session channel.
  - name: interaction_timestamp
    description: UTC-aware session start instant.
  - name: attribution_status
    description: 'Exhaustive assignment state: attributed or unattributed, across
      all statuses.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - attributed
          - unattributed
  - name: unattributed_reason
    description: 'NULL for attributed. Otherwise priority: missing order identity,
      missing order time, no same-customer sessions, missing interaction time, unknown
      campaign, missing campaign in window, then no eligible interaction in window.
      A diagnostic, not proof of a unique cause; inspect candidates for all exclusions.'
  - name: reporting_date
    description: 'Europe/London calendar date: event instants converted before casting;
      ad dates and budget days are already London dates.'
    data_tests:
    - not_null
  - name: commercially_eligible
    description: True only for status IN (completed, partially_refunded) AND net_order_amount_gbp
      > 0. This governs conversions and acquisition, not revenue inclusion.
    data_tests:
    - not_null
  - name: revenue_scope
    description: True for completed, partially_refunded and refunded sales; excludes
      cancellations. Signed amounts are preserved.
    data_tests:
    - not_null
  - name: is_attributed
    description: True for an existing campaign assignment; independent of commercial
      eligibility.
    data_tests:
    - not_null
  - name: marketing_channel
    description: Paid campaign channel, valid Direct/Organic session channel, or Unattributed
      for orders without an assignment. Never infer Direct/Organic from unmatched
      orders.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: &id001
          - Meta Paid Social
          - Google Paid Search
          - TikTok Paid Social
          - Direct
          - Organic
          - Unattributed
  - name: negative_input_count
    description: Internal diagnostic count of negative media rows, orders (including
      associated line anomalies), or campaign-budget days. Not a count of distinct
      errors; >0 drives a flag.
    data_tests:
    - not_null
- name: int_marketing__first_observed_acquisitions
  description: Internal one-row-per-customer snapshot acquisition ledger. Select first
    positive-net completed/partially-refunded order across all history, UTC timestamp
    then ascending order_id. Recomputed with snapshot restatements; no lifetime claim.
  data_tests:
  - marketing_unique_grain:
      arguments:
        columns:
        - customer_id
  columns:
  - name: customer_id
    description: Exact identified source customer; one acquisition per customer across
      the whole snapshot.
    data_tests:
    - not_null
    - unique
    - relationships:
        arguments:
          to: ref('stg_marketing__customers')
          field: customer_id
  - name: acquisition_order_id
    description: Earliest commercially eligible order across all available history,
      ordered by UTC timestamp then ascending lexical order ID.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_marketing__orders')
          field: order_id
  - name: acquisition_timestamp
    description: UTC instant of the selected first eligible order, before London period
      assignment.
    data_tests:
    - not_null
  - name: reporting_date
    description: 'Europe/London calendar date: event instants converted before casting;
      ad dates and budget days are already London dates.'
    data_tests:
    - not_null
  - name: campaign_id
    description: Canonical single-channel campaign key; NULL only for campaignless
      sessions or unmatched outcomes in internal daily facts.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_marketing__campaigns')
          field: campaign_id
  - name: marketing_channel
    description: Paid campaign channel, valid Direct/Organic session channel, or Unattributed
      for orders without an assignment. Never infer Direct/Organic from unmatched
      orders.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: *id001
  - name: is_attributed
    description: True for an existing campaign assignment; independent of commercial
      eligibility.
    data_tests:
    - not_null
  - name: acquisition_basis
    description: Always first_observed_2025_snapshot. Acquisition uses only available
      2025 purchase history, not verified lifetime new customers.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - first_observed_2025_snapshot
- name: int_marketing__daily_facts
  description: Internal date x nullable campaign x marketing channel fact spine. Separate
    media/session/order/acquisition/budget aggregates join a union of keys using NULL-safe
    campaign equality. Complete fixed-snapshot coverage permits zeros for absent activity.
    Not a consumer ratio table.
  data_tests:
  - marketing_unique_grain:
      arguments:
        columns:
        - reporting_date
        - campaign_id
        - marketing_channel
  columns:
  - name: reporting_date
    description: 'Europe/London calendar date: event instants converted before casting;
      ad dates and budget days are already London dates.'
    data_tests:
    - not_null
  - name: campaign_id
    description: Canonical single-channel campaign key; NULL only for campaignless
      sessions or unmatched outcomes in internal daily facts.
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_marketing__campaigns')
          field: campaign_id
  - name: marketing_channel
    description: Paid campaign channel, valid Direct/Organic session channel, or Unattributed
      for orders without an assignment. Never infer Direct/Organic from unmatched
      orders.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values: *id001
  - name: spend_gbp
    description: Recorded GBP platform media spend, aggregated independently of sessions/orders;
      excludes fees, taxes, credits and unrecorded channel costs.
    data_tests:
    - not_null
  - name: impressions
    description: Recorded ad exposures, summed once per ad grain.
    data_tests:
    - not_null
  - name: clicks
    description: Recorded comparable outbound ad clicks, summed once per ad grain.
    data_tests:
    - not_null
  - name: valid_sessions
    description: All valid supplied sessions, including anonymous paid sessions; Direct/Organic
      stay in their own channel. No order-based reclassification.
    data_tests:
    - not_null
  - name: placed_orders
    description: All recorded order attempts once, including cancelled and fully refunded
      orders.
    data_tests:
    - not_null
  - name: attributed_placed_orders
    description: All-status placed orders with a campaign assignment. Not the commercially
      eligible attributed conversion measure.
    data_tests:
    - not_null
  - name: unattributed_placed_orders
    description: All-status placed orders without a campaign assignment; retained
      even when commercially ineligible.
    data_tests:
    - not_null
  - name: eligible_conversions
    description: Completed or partially_refunded orders with positive net value. Includes
      both attributed and unattributed outcomes at overview scope.
    data_tests:
    - not_null
  - name: attributed_orders
    description: Commercially eligible orders assigned to a campaign; campaign/paid-channel
      conversion numerator.
    data_tests:
    - not_null
  - name: unattributed_eligible_orders
    description: Commercially eligible orders without campaign assignment; overall
      website conversion numerator includes these.
    data_tests:
    - not_null
  - name: first_observed_acquisitions
    description: Customers whose earliest eligible order across all available snapshot
      history falls in this period/scope; each customer counted once.
    data_tests:
    - not_null
  - name: attributed_first_observed_acquisitions
    description: First observed acquisitions with paid campaign assignment; denominator
      for matching period media-only CAC.
    data_tests:
    - not_null
  - name: unattributed_first_observed_acquisitions
    description: First observed acquisitions without assignment. Never reassign them
      using later paid orders.
    data_tests:
    - not_null
  - name: raw_gross_order_amount_gbp
    description: All-status original merchandise amount, including cancelled attempts;
      audit measure, not governed gross revenue.
    data_tests:
    - not_null
  - name: cancellation_gross_amount_gbp
    description: Original gross value of cancelled attempts, excluded from gross merchandise
      revenue; equals cancellation reversals in this fixed source.
    data_tests:
    - not_null
  - name: gross_merchandise_revenue_gbp
    description: Original merchandise value of completed, partially_refunded and refunded
      sales, excluding cancelled attempts. Not accounting revenue.
    data_tests:
    - not_null
  - name: sales_refunds_gbp
    description: Positive source deductions for non-cancelled sales, including partial
      and full refunds; final snapshot at original order time.
    data_tests:
    - not_null
  - name: cancellation_reversals_gbp
    description: Source deductions for cancelled attempts only; bookkeeping reversal,
      not evidence of a cash refund.
    data_tests:
    - not_null
  - name: net_revenue_gbp
    description: Non-cancelled sales net amount, including signed/zero values. Gross
      merchandise revenue minus sales refunds, without subtracting refunds twice.
    data_tests:
    - not_null
  - name: raw_net_order_amount_gbp
    description: All-status source net amount; raw gross minus sales refunds minus
      cancellation reversals. Audit reconciliation.
    data_tests:
    - not_null
  - name: attributed_gross_merchandise_revenue_gbp
    description: Original merchandise value of completed, partially_refunded and refunded
      sales, excluding cancelled attempts. Not accounting revenue. Restricted to attributed
      orders across revenue-eligible statuses (cancellation reversals use cancelled
      status).
    data_tests:
    - not_null
  - name: unattributed_gross_merchandise_revenue_gbp
    description: Original merchandise value of completed, partially_refunded and refunded
      sales, excluding cancelled attempts. Not accounting revenue. Restricted to unattributed
      orders across revenue-eligible statuses (cancellation reversals use cancelled
      status).
    data_tests:
    - not_null
  - name: attributed_sales_refunds_gbp
    description: Positive source deductions for non-cancelled sales, including partial
      and full refunds; final snapshot at original order time. Restricted to attributed
      orders across revenue-eligible statuses (cancellation reversals use cancelled
      status).
    data_tests:
    - not_null
  - name: unattributed_sales_refunds_gbp
    description: Positive source deductions for non-cancelled sales, including partial
      and full refunds; final snapshot at original order time. Restricted to unattributed
      orders across revenue-eligible statuses (cancellation reversals use cancelled
      status).
    data_tests:
    - not_null
  - name: attributed_cancellation_reversals_gbp
    description: Source deductions for cancelled attempts only; bookkeeping reversal,
      not evidence of a cash refund. Restricted to attributed orders across revenue-eligible
      statuses (cancellation reversals use cancelled status).
    data_tests:
    - not_null
  - name: unattributed_cancellation_reversals_gbp
    description: Source deductions for cancelled attempts only; bookkeeping reversal,
      not evidence of a cash refund. Restricted to unattributed orders across revenue-eligible
      statuses (cancellation reversals use cancelled status).
    data_tests:
    - not_null
  - name: attributed_net_revenue_gbp
    description: Non-cancelled sales net amount, including signed/zero values. Gross
      merchandise revenue minus sales refunds, without subtracting refunds twice.
      Restricted to attributed orders across revenue-eligible statuses (cancellation
      reversals use cancelled status).
    data_tests:
    - not_null
  - name: unattributed_net_revenue_gbp
    description: Non-cancelled sales net amount, including signed/zero values. Gross
      merchandise revenue minus sales refunds, without subtracting refunds twice.
      Restricted to unattributed orders across revenue-eligible statuses (cancellation
      reversals use cancelled status).
    data_tests:
    - not_null
  - name: allocated_budget_gbp
    description: Lifetime campaign budget allocated uniformly across inclusive active
      days; additive across days/campaigns. Monthly totals are allocations, not approved
      monthly budgets; floating precision may require tolerance.
    data_tests:
    - not_null
  - name: negative_input_count
    description: Internal diagnostic count of negative media rows, orders (including
      associated line anomalies), or campaign-budget days. Not a count of distinct
      errors; >0 drives a flag.
    data_tests:
    - not_null
- name: mart_marketing__campaign_daily
  description: 'Business mart: London reporting date x campaign. Includes every active
    budget day and observed fact date, even outside campaign activity. Additive measures
    preserve spend-only campaigns. Lifetime/cumulative budgets and ratios must not
    be summed.'
  data_tests:
  - marketing_unique_grain:
      arguments:
        columns:
        - reporting_date
        - campaign_id
  - marketing_mart_invariants:
      arguments:
        scope: campaign
        budget_kind: daily
  columns:
  - name: reporting_date
    description: 'Europe/London calendar date: event instants converted before casting;
